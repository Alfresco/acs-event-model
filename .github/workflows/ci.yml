name: ACS Event Model CI

on:
  pull_request:
    branches:
      - master
      - feature/**
      - fix/**
      - release/**
  push:
    branches:
      - master
      - feature/**
      - fix/**
      - release/**
  workflow_dispatch:

permissions:
  contents: read

env:
  # Both variables are required to be set before the release process starts.
  # As the release is triggered by a commit message with "[release]" keyword on master or a release branch,
  # setting these variables to new values can be done in the same commit and will indicate the release and the dev versions in it.
  DEVELOPMENT_VERSION: "1.1.0-A.2-SNAPSHOT" # The version that will be set in pom files after the release (next dev version)
  RELEASE_VERSION: "1.1.0-A.1" # The version of the release (tag).
  GITHUB_ACTIONS_DEPLOY_TIMEOUT: 60
  MAVEN_CLI_OPTS: "-B -e -fae"
  MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
  MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}

jobs:  
  test_application:
    name: "Build and test"
    runs-on: ubuntu-latest
    if: >
      !contains(github.event.head_commit.message, '[skip build]') &&
      !contains(github.event.head_commit.message, '[skip tests]')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@v18.26.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@v18.26.0
      - name: "Build application"
        run: mvn ${{ env.MAVEN_CLI_OPTS }} clean package -DskipTests
      - name: "Run tests"
        run: mvn ${{ env.MAVEN_CLI_OPTS }} verify

  release_and_deploy_to_nexus:
    name: "Make release and deploy to Nexus"
    runs-on: ubuntu-latest
    needs:
      - test_application
    if: >
      !(failure() || cancelled()) &&
      (github.ref_name == 'master' || startsWith(github.ref_name, 'release/')) &&
      github.event_name != 'pull_request' &&
      contains(github.event.head_commit.message, '[release]')
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_ENGINEERING_CONTRIB_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_ENGINEERING_CONTRIB_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@v18.26.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/configure-git-author@v18.26.0
        with:
          username: ${{ secrets.BOT_GITHUB_USERNAME }}
          email: ${{ secrets.BOT_GITHUB_EMAIL }}
      - name: "Release"
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        uses: Alfresco/alfresco-build-tools/.github/actions/maven-release-slim@v18.26.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          release-version: ${{ env.RELEASE_VERSION }}
          development-version: ${{ env.DEVELOPMENT_VERSION }}
